<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripTrace · 사진으로 보는 여행</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header><p class="eyebrow">TRIPTRACE / LOCAL TEST</p><h1>사진을 따라, 여행의 기록</h1><p>촬영 지점을 시간순으로 지나는 자동차 추천 경로입니다. 실제 여행 당시의 이동 경로와는 다를 수 있습니다.</p></header>
  <p id="status" role="status">사진 메타데이터를 읽고 있습니다…</p>
  <p id="error" role="alert" hidden></p>
  <main>
    <section class="map-panel" aria-label="여행 지도"><div id="map"></div><button id="fit" disabled>전체 경로 보기</button></section>
    <aside><h2>촬영 타임라인</h2><p class="hint">사진을 누르면 지도에서 위치를 확인할 수 있습니다. 사진은 Gemini로 전송되어 AI 설명이 순서대로 표시됩니다.</p><ol id="timeline"></ol></aside>
  </main>
  <details id="excluded" hidden><summary id="excluded-title"></summary><ul id="skipped"></ul></details>
</body>
</html>
